<p-fileupload
    mode="basic"
    chooseLabel="Examinar (max. 10MB)"
    [chooseIcon]="PrimeIcons.SEARCH"
    uploadLabel="Subir archivo"
    [accept]="accept()"
    [maxFileSize]="10485760"
    invalidFileSizeMessageSummary="{0}: Archivo demasiado pesado, "
    invalidFileSizeMessageDetail="el tamaño máximo permitido es 10MB."
    [auto]="true"
    [customUpload]="true"
    (uploadHandler)="onFileSelect($event)">
</p-fileupload>
